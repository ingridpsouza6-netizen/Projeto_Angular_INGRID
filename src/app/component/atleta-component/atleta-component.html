<section id="form">
    <h2>Cadastro de Atleta</h2>

    <form id="form-atleta" (ngSubmit)="salvar()">

        <label for="nome">Nome Completo</label>
        <input
            type="text"
            name="nome"
            id="nome"
            [(ngModel)]="nome"
            class="input01"
            maxlength="60"
            required
            placeholder="Digite o nome Completo">

        <label for="cpf">CPF</label>
        <input
            type="text"
            name="cpf"
            id="cpf"
            [(ngModel)]="cpf"
            class="input02"
            maxlength="14"
            required
            placeholder="Digite o CPF">

        <label for="dataNascimento">
            Data de nascimento
        </label>

        <input
            type="date"
            id="dataNascimento"
            name="dataNascimento"
            [(ngModel)]="dataNascimento"
            required>

        <label for="peso">Peso</label>
        <input
            type="number"
            name="peso"
            id="peso"
            [(ngModel)]="peso"
            required
            placeholder="Digite o peso">

        <label for="altura">Altura</label>
        <input
            type="number"
            name="altura"
            id="altura"
            [(ngModel)]="altura"
            step="0.01"
            required
            placeholder="Digite a altura">

        <label for="sexo">Sexo</label>

        <input
            type="radio"
            name="sexo"
            [(ngModel)]="sexo"
            id="sexoM"
            class="radio01"
            required
            value="M">
        Masculino

        <input
            type="radio"
            name="sexo"
            [(ngModel)]="sexo"
            id="sexoF"
            class="radio01"
            required
            value="F">
        Feminino

        <input
            type="radio"
            name="sexo"
            [(ngModel)]="sexo"
            id="sexoN"
            class="radio01"
            required
            value="N">
        Não Declarar

        <label for="cep">CEP*</label>
        <input
            type="text"
            name="cep"
            id="cep"
            [(ngModel)]="cep"
            class="input02"
            maxlength="9"
            required
            placeholder="Digite o CEP">

        <label for="rua-logradouro">Rua/Logradouro*</label>
        <input
            type="text"
            name="rua-logradouro"
            id="rua-logradouro"
            [(ngModel)]="ruaLogradouro"
            class="input01"
            maxlength="100"
            required
            placeholder="Digite a Rua ou o Logradouro">

        <label for="bairro">Bairro*</label>
        <input
            type="text"
            name="bairro"
            id="bairro"
            [(ngModel)]="bairro"
            class="input02"
            maxlength="60"
            required
            placeholder="Digite o bairro">

        <label for="cidade">Cidade*</label>
        <input
            type="text"
            name="cidade"
            id="cidade"
            [(ngModel)]="cidade"
            class="input02"
            maxlength="60"
            required
            placeholder="Digite a cidade">

        <label for="uf">UF*</label>
        <input
            type="text"
            name="uf"
            id="uf"
            [(ngModel)]="uf"
            class="input02"
            maxlength="2"
            required
            placeholder="Digite a UF">

        <div id="div-btns">
            <button type="submit" id="btnAdd">Cadastrar</button>
            <button type="reset" id="btnLimpar">Limpar</button>
        </div>

    </form>
</section>
