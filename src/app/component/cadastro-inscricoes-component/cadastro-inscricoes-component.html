<section id="form-inscricao">

    <h2>Inscrição na Corrida</h2>

    <form (ngSubmit)="salvar()">

        <div class="linha">

            <div class="campo">

                <label for="atleta">
                    Atleta Cadastrado
                </label>

                <select
                    id="atleta"
                    name="atleta"
                    [(ngModel)]="idAtleta"
                    required>

                    <option [ngValue]="0">
                        Selecione o atleta (ou digite o CPF)
                    </option>

                    @for (atleta of atletas; track atleta.id) {

                        <option [ngValue]="atleta.id">
                            {{ atleta.nome }}
                        </option>

                    }

                </select>

            </div>


            <div class="campo">

                <label for="cpf">
                    Ou Buscar por CPF
                </label>

                <input
                    type="text"
                    id="cpf"
                    name="cpf"
                    placeholder="000.000.000-00">

            </div>

        </div>


        <div class="linha">

            <div class="campo">

                <label for="corrida">
                    Corrida Escolhida
                </label>

                <select
                    id="corrida"
                    name="corrida"
                    [(ngModel)]="idCorrida"
                    required>

                    <option value="">
                        Selecione uma corrida
                    </option>

                    @for (corrida of corridas; track corrida.id) {

                        <option [value]="corrida.id">

                            {{ corrida.descricao_corrida }}
                            ({{ corrida.data_corrida }})

                        </option>

                    }

                </select>

            </div>


            <div class="campo">

                <label>
                    Distância da Prova
                </label>

                <div class="opcoes">

                    <label>
                        <input
                            type="radio"
                            name="distancia"
                            value="5">
                        5km
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="distancia"
                            value="10">
                        10km
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="distancia"
                            value="25">
                        25km
                    </label>

                </div>

            </div>

        </div>


        <div class="linha">

            <div class="campo">

                <label for="camiseta">
                    Tamanho da Camiseta (Kit)
                </label>

                <select
                    id="camiseta"
                    name="camiseta">

                    <option value="">
                        Selecione
                    </option>

                    <option value="PP">PP</option>
                    <option value="P">P</option>
                    <option value="M">M</option>
                    <option value="G">G</option>
                    <option value="GG">GG</option>

                </select>

            </div>


            <div class="campo">

                <label for="categoria">
                    Categoria / Faixa Etária
                </label>

                <input
                    type="text"
                    id="categoria"
                    name="categoria"
                    placeholder="Geral Masculino / 30-39 anos">

            </div>

        </div>


        <div id="valor">

            <strong>
                Valor da Inscrição:
            </strong>

            <span>
                R$ 89,90
            </span>

        </div>


        <div id="termos">

            <label>

                <input
                    type="checkbox"
                    name="termos"
                    required>

                Li e aceito os termos do regulamento da prova
                e declaração de saúde.

            </label>

        </div>


        <button
            type="submit"
            id="btnFinalizar">

            Finalizar e Ir para Pagamento

        </button>

    </form>

</section>
