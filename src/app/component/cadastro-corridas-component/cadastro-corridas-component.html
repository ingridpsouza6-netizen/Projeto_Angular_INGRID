<section id="form">

    <h2>
        {{ idCorridaEditando === ''
            ? 'Cadastro de Corrida'
            : 'Editar Corrida'
        }}
    </h2>


    <form
        id="form-corrida"
        (ngSubmit)="salvar()">


        <label for="descricao_corrida">
            Nome da Corrida
        </label>


        <input
            type="text"
            name="descricao_corrida"
            id="descricao_corrida"
            [(ngModel)]="descricao_corrida"
            maxlength="100"
            required
            placeholder="Digite o nome da corrida">


        <label for="data_corrida">
            Data
        </label>


        <input
            type="date"
            name="data_corrida"
            id="data_corrida"
            [(ngModel)]="data_corrida"
            required>


        <label>
            Distância da Corrida
        </label>


        <div>

            <label>

                <input
                    type="checkbox"
                    name="distancia5km"
                    [(ngModel)]="distancia5km">

                5 km

            </label>


            <label>

                <input
                    type="checkbox"
                    name="distancia10km"
                    [(ngModel)]="distancia10km">

                10 km

            </label>


            <label>

                <input
                    type="checkbox"
                    name="distancia25km"
                    [(ngModel)]="distancia25km">

                25 km

            </label>

        </div>


        <div id="div-btns">

            <button
                type="submit"
                id="btnAdd">

                {{ idCorridaEditando === ''
                    ? 'Cadastrar'
                    : 'Salvar Alterações'
                }}

            </button>


            <button
                type="button"
                id="btnLimpar"
                (click)="limpar()">

                Limpar

            </button>

        </div>

    </form>

</section>
